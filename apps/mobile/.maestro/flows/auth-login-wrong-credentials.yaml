appId: nl.scmuiden.app
---
# Verify: wrong credentials show the Dutch error banner, not a raw Supabase message.
- launchApp:
    clearState: true
- assertVisible: "Inloggen"
- tapOn:
    text: "naam@voorbeeld.nl"
- inputText: "test@example.com"
- tapOn:
    text: "••••••••"
- inputText: "FoutWachtwoord123"
- hideKeyboard:
- tapOn:
    text: "Inloggen"
- assertVisible: "E-mailadres of wachtwoord onjuist"
- assertNotVisible: "Invalid login credentials"
